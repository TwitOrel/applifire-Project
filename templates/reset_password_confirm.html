{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Set New Password - Applifire</title>
  <link rel="stylesheet" href="{% static 'css/reset_password_confirm.css' %}">
</head>
<body>
  <div class="card">
    <h2>Set a new password</h2>
    <p>Enter a new password for your account.</p>

    <form id="new-password-form">
      <input type="password" id="new-password" placeholder="New password" required autocomplete="new-password"/>
      <input type="password" id="confirm-password" placeholder="Confirm password" required autocomplete="confirm-new-password"/>
      <p id="reset-error-message" class="error-message"></p>
      <button type="submit">Change Password</button>
    </form>

    <div class="login-link">
      Back to <a href="/login/">Sign in</a>
    </div>
  </div>
  <script src="{% static 'js/reset_password_confirm.js' %}"></script>
</body>
</html>
